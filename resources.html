<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="超级站 — 资源中心，海量影视、软件、游戏资源">
  <title>资源中心 — 超级站</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ========== 资源页特有样式 ========== */

    /* ---- 分类选项卡 ---- */
    .category-tabs {
      display: flex;
      justify-content: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }

    .category-tab {
      padding: 10px 36px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-family);
      border: 2px solid var(--color-border);
      border-radius: 50px;
      background: var(--color-white);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .category-tab:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .category-tab.active {
      background: var(--color-primary);
      color: var(--color-white);
      border-color: var(--color-primary);
    }

    /* ---- 搜索区 ---- */
    .search-section {
      padding-top: 100px;
      padding-bottom: var(--space-md);
      text-align: center;
      background: var(--color-bg-alt);
    }

    .search-wrapper {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-wrapper input {
      width: 100%;
      padding: 16px 20px 16px 52px;
      font-size: 16px;
      border: 2px solid var(--color-border);
      border-radius: 50px;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      font-family: var(--font-family);
      background: var(--color-white);
    }

    .search-wrapper input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: var(--color-text-secondary);
      pointer-events: none;
    }

    .search-hint {
      margin-top: var(--space-xs);
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    /* ---- 横幅轮播 ---- */
    .banner-section {
      padding: var(--space-md) var(--space-md) var(--space-lg);
    }

    .banner-carousel {
      max-width: var(--max-width);
      margin: 0 auto;
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      height: 340px;
    }

    /* 幻灯片轨道 */
    .banner-track {
      display: flex;
      height: 100%;
      transition: transform 0.5s ease;
    }

    /* 单张幻灯片 */
    .banner-slide {
      flex: 0 0 100%;
      height: 100%;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: var(--space-xl) var(--space-lg);
      color: var(--color-white);
    }

    /* ===== 公告页 ===== */
    .banner-slide.announcement {
      justify-content: space-between;
      text-align: center;
      flex-direction: column;
      padding: var(--space-md) var(--space-lg);
    }
    /* 顶部：图标+标题同行 */
    .banner-ann-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
    }
    .banner-ann-icon {
      font-size: 38px;
    }
    .banner-ann-title {
      font-size: 24px;
      font-weight: 700;
    }
    /* 中部：正文 */
    .banner-ann-body {
      font-size: 16px;
      opacity: 0.9;
      max-width: 600px;
      line-height: 1.8;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 底部：免责声明小字 */
    .banner-ann-sub {
      font-size: 11px;
      opacity: 0.55;
      line-height: 1.5;
      padding: 0 var(--space-md);
    }

    /* ===== 电影推荐页（海报全幅背景 + 右侧渐变过渡）===== */
    .banner-slide.movie {
      justify-content: flex-end;
      padding: 0;
    }

    /* 海报作为全幅背景（偏左） */
    .banner-bg-img {
      position: absolute;
      inset: 0;
      width: 90%;
      height: 100%;
      object-fit: cover;
      object-position: left center;
      z-index: 0;
    }

    /* 右侧渐变叠加层：从海报自然过渡到纯色背景 */
    .banner-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      /* 宽渐变带，消除撕裂感 */
      background: linear-gradient(to right,
        transparent 25%,
        transparent 50%,
        var(--slide-bg-end, #1A237E) 80%
      );
    }

    /* 文字区（右对齐，叠加在渐变层上方） */
    .banner-text {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      width: 55%;
      max-width: 500px;
      padding: var(--space-xl) var(--space-lg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      text-align: right;
    }
    .banner-badge {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: var(--space-sm);
      backdrop-filter: blur(4px);
      width: fit-content;
    }
    .banner-text h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: var(--space-xs);
      line-height: 1.3;
    }
    .banner-text p {
      opacity: 0.85;
      font-size: 14px;
      margin-bottom: var(--space-md);
      max-width: 380px;
      line-height: 1.6;
    }
    .banner-text .btn {
      background: var(--color-white);
      color: var(--color-primary);
      font-weight: 600;
      font-size: 14px;
      padding: 10px 24px;
      width: fit-content;
    }
    .banner-text .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* ===== 圆点指示器 ===== */
    .banner-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: var(--space-sm);
    }
    .banner-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      background: var(--color-white);
      cursor: pointer;
      transition: all var(--transition-fast);
      padding: 0;
    }
    .banner-dot:hover {
      border-color: var(--color-primary);
    }
    .banner-dot.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      transform: scale(1.15);
    }

    @media (max-width: 768px) {
      .banner-carousel { height: 240px; }
      .banner-slide.announcement { overflow-y: auto; justify-content: flex-start; padding: var(--space-sm) var(--space-md); }
      .banner-ann-body { font-size: 14px; display: block; text-align: left; }
      .banner-slide.movie { justify-content: center; }
      .banner-text { width: 100%; max-width: none; padding: var(--space-sm) var(--space-md); text-align: center; align-items: center; }
      .banner-text h2 { font-size: 18px; }
      .banner-text p { font-size: 12px; }
    }

    /* ---- 资源列表 ---- */
    .resources-section {
      padding: var(--space-lg) var(--space-md) var(--space-2xl);
    }

    .resource-grid {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .resource-card {
      display: flex;
      gap: var(--space-md);
      padding: var(--space-md);
      margin-bottom: var(--space-sm);
      max-width: var(--max-width);
      margin-left: auto;
      margin-right: auto;
      align-items: flex-start;
    }

    .resource-card-cover {
      flex-shrink: 0;
      width: 140px;
      height: 190px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--color-bg-alt);
    }

    .resource-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 软件模式：图标缩小为 80×80 */
    .software-mode .resource-card-cover {
      width: 80px;
      height: 80px;
    }

    .software-mode .resource-card-cover img {
      object-fit: contain;
      background: var(--color-bg-alt);
    }

    /* 软件模式：2 列网格 */
    .software-mode #resourceList {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-md);
    }

    .software-mode .resource-card {
      margin-bottom: 0;
      max-width: none;
      min-height: 200px;
      height: 100%;
    }

    @media (max-width: 640px) {
      .software-mode #resourceList {
        grid-template-columns: 1fr;
      }
    }

    .resource-card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .resource-card-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--color-text);
    }

    .resource-card-meta {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      flex-wrap: wrap;
    }

    .tag-outline {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
    }

    .resource-card-date {
      font: var(--text-xs);
      color: var(--color-text-secondary);
      margin-left: auto;
    }

    .resource-card-desc {
      font-size: 14px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .resource-card-actions {
      display: flex;
      gap: var(--space-sm);
      margin-top: auto;
    }

    .btn-sm {
      padding: 6px 16px;
      font-size: 13px;
    }

    /* ---- 分页 ---- */
    .pagination {
      display: flex;
      justify-content: center;
      gap: var(--space-xs);
      margin-top: var(--space-lg);
    }

    .page-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-white);
      color: var(--color-text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all var(--transition-fast);
      font-family: var(--font-family);
    }

    .page-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .page-btn.active {
      background: var(--color-primary);
      color: var(--color-white);
      border-color: var(--color-primary);
    }

    .page-arrow {
      font-size: 12px;
      width: auto;
      padding: 0 12px;
    }

    .page-arrow:disabled,
    .page-arrow.disabled {
      opacity: 0.3;
      pointer-events: none;
      cursor: default;
    }

    /* ---- 无结果提示 ---- */
    .no-result {
      display: none;
      text-align: center;
      padding: var(--space-2xl) var(--space-md);
      color: var(--color-text-secondary);
    }

    .no-result .no-result-icon {
      font-size: 48px;
      margin-bottom: var(--space-sm);
    }

    /* ---- 响应式 ---- */
    @media (max-width: 768px) {
      .resource-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .resource-card-cover {
        width: 120px;
        height: 160px;
      }

      .resource-card-meta {
        justify-content: center;
      }

      .resource-card-date {
        margin-left: 0;
        width: 100%;
      }

      .resource-card-actions {
        justify-content: center;
      }

      .banner-card {
        flex-direction: column;
        text-align: center;
        padding: var(--space-lg);
      }

      .banner-info h2 {
        font-size: 22px;
      }
    }

    /* ========== 下载弹窗遮罩 ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      position: relative;
      display: flex;
      gap: var(--space-md);
      background: var(--color-white);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      padding: var(--space-lg);
      max-width: 560px;
      width: 90%;
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--color-bg-alt);
      color: var(--color-text-secondary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .modal-close:hover {
      background: #FEE2E2;
      color: #EF4444;
    }

    .modal-cover {
      flex-shrink: 0;
      width: 120px;
      height: 165px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      background: var(--color-bg-alt);
    }

    .modal-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.3;
    }

    .modal-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-link-row {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      font-size: 13px;
    }

    .modal-link-label {
      font-weight: 600;
      color: var(--color-text);
      flex-shrink: 0;
      font-size: 13px;
    }

    .modal-link-text {
      flex: 1;
      font-size: 12px;
      font-family: "Consolas","Courier New",monospace;
      color: var(--color-primary);
      background: var(--color-bg-alt);
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid var(--color-border);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .modal-copy-btn {
      flex-shrink: 0;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-family);
      background: var(--color-white);
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .modal-copy-btn:hover {
      background: var(--color-primary);
      color: var(--color-white);
    }

    .modal-copy-btn.copied {
      background: var(--color-success);
      color: var(--color-white);
      border-color: var(--color-success);
    }

    .modal-disclaimer {
      font-size: 12px;
      color: #92400E;
      background: #FEF3C7;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    @media (max-width: 500px) {
      .modal-card {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: var(--space-md);
      }

      .modal-link-text {
        white-space: normal;
        word-break: break-all;
      }
    }
  </style>
</head>

  <!-- 脚本 -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    /* ===== 横幅轮播（数据来自 data.js 全局 bannerSlides）===== */
    var currentBanner = 0;
    var bannerTimer = null;

    function renderBannerCarousel() {
      var track = document.getElementById('bannerTrack');
      var dots = document.getElementById('bannerDots');
      if (!track || !dots) return;

      // 渲染幻灯片
      var slideHtml = '';
      bannerSlides.forEach(function(s) {
        if (s.type === 'announcement') {
          slideHtml += '<div class="banner-slide announcement" style="background:' + s.bg + '">' +
            '<div class="banner-ann-top">' +
              '<span class="banner-ann-icon">' + s.icon + '</span>' +
              '<span class="banner-ann-title">' + s.title + '</span>' +
            '</div>' +
            '<div class="banner-ann-body">' + (s.body || '') + '</div>' +
            '<div class="banner-ann-sub">' + (s.subtitle || '') + '</div>' +
            '</div>';
        } else {
          var endCol = s.endColor || '#1A237E';
          slideHtml += '<div class="banner-slide movie" style="background:' + s.bg + ';--slide-bg-end:' + endCol + '">' +
            '<img class="banner-bg-img" src="' + s.cover + '" alt="' + s.title + '" onerror="this.style.display=\'none\'">' +
            '<div class="banner-overlay"></div>' +
            '<div class="banner-text">' +
              '<span class="banner-badge">' + s.badge + '</span>' +
              '<h2>' + s.title + '</h2>' +
              '<p>' + s.description + '</p>' +
              '<a href="' + s.link + '" class="btn">查看详情 →</a>' +
            '</div>' +
            '</div>';
        }
      });
      track.innerHTML = slideHtml;

      // 渲染圆点
      var dotHtml = '';
      bannerSlides.forEach(function(_, i) {
        dotHtml += '<button class="banner-dot' + (i === 0 ? ' active' : '') + '" onclick="goToBanner(' + i + ')"></button>';
      });
      dots.innerHTML = dotHtml;

      goToBanner(0, false);
    }

    function goToBanner(index, animate) {
      if (typeof animate === 'undefined') animate = true;
      var track = document.getElementById('bannerTrack');
      if (!track) return;
      if (!animate) track.style.transition = 'none';
      else track.style.transition = 'transform 0.5s ease';
      track.style.transform = 'translateX(-' + (index * 100) + '%)';
      currentBanner = index;

      // 更新圆点
      document.querySelectorAll('.banner-dot').forEach(function(d, i) {
        d.classList.toggle('active', i === index);
      });

      // 恢复过渡
      if (!animate) {
        setTimeout(function() { track.style.transition = 'transform 0.5s ease'; }, 50);
      }

      // 用户手动点击圆点切换时，重置自动轮播计时器
      if (animate) {
        stopBannerTimer();
        startBannerTimer();
      }
    }

    function nextBanner() {
      var next = (currentBanner + 1) % bannerSlides.length;
      goToBanner(next, true);
    }

    function startBannerTimer() {
      stopBannerTimer();
      bannerTimer = setInterval(nextBanner, 5000);
    }

    function stopBannerTimer() {
      if (bannerTimer) { clearInterval(bannerTimer); bannerTimer = null; }
    }

    /* 初始化 */
    (function() {
      renderBannerCarousel();
      startBannerTimer();
      var carousel = document.getElementById('bannerCarousel');
      if (carousel) {
        carousel.addEventListener('mouseenter', stopBannerTimer);
        carousel.addEventListener('mouseleave', startBannerTimer);
      }
    })();

    /* ===== 分类 + 页面加载 ===== */
    var currentCategory = 'movie'; // 'movie' | 'software'

    function switchCategory(cat) {
      currentCategory = cat;
      // 选项卡样式
      document.querySelectorAll('.category-tab').forEach(function(t) {
        t.classList.toggle('active', t.getAttribute('data-category') === cat);
      });
      // 软件模式 class（控制封面尺寸）
      var grid = document.getElementById('resourceGrid');
      grid.className = 'resource-grid' + (cat === 'software' ? ' software-mode' : '');
      // 横幅：软件模式隐藏
      var banner = document.getElementById('bannerSection');
      if (banner) banner.style.display = (cat === 'software') ? 'none' : 'block';
      // 更新搜索提示
      var input = document.getElementById('resourceSearch');
      input.value = '';
      input.placeholder = cat === 'software'
        ? '搜索软件...（输入软件名或标签）'
        : '搜索你想要的资源...（输入影片名、类型或标签）';
      // 重新渲染
      document.getElementById('noResult').style.display = 'none';
      if (typeof renderPage === 'function') renderPage(1);
    }

    /* 获取当前分类的资源 */
    function getCategoryResources() {
      return resources.filter(function(item) {
        if (currentCategory === 'software') return item.type === '软件';
        return item.type === '电影' || item.type === '剧集';
      });
    }

    /* 页面加载（始终从影视选项卡开始）*/
    document.addEventListener('DOMContentLoaded', function() {
      currentCategory = 'movie';
      if (typeof renderPage === 'function') renderPage(1);
    });

    /* ===== 下载弹窗 ===== */
    function openDownloadModal(id) {
      var resource = null;
      if (typeof resources !== 'undefined') {
        for (var i = 0; i < resources.length; i++) {
          if (resources[i].id === id) { resource = resources[i]; break; }
        }
      }
      if (!resource) return;

      var modal = document.getElementById('downloadModal');
      var card  = document.getElementById('modalCard');
      var dl    = resource.downloads || {};

      var linksHTML = '';
      var platforms = [
        { key: 'baidu', name: '百度网盘', icon: '📦' },
        { key: 'quark', name: '夸克网盘', icon: '☁️' }
      ];
      platforms.forEach(function(p) {
        if (dl[p.key] && dl[p.key].link) {
          linksHTML +=
            '<div class="modal-link-row">' +
              '<span class="modal-link-label">' + p.icon + ' ' + p.name + '</span>' +
              '<span class="modal-link-text">' + dl[p.key].link + '</span>' +
              '<button class="modal-copy-btn" onclick="event.stopPropagation();modalCopy(\'' + dl[p.key].link + '\', this)">复制</button>' +
            '</div>';
        }
      });

      card.innerHTML =
        '<button class="modal-close" onclick="closeDownloadModal()">✕</button>' +
        '<div class="modal-cover">' +
          '<img src="' + resource.cover + '" alt="' + resource.title + '" onerror="this.style.display=\'none\'">' +
        '</div>' +
        '<div class="modal-info">' +
          '<div class="modal-title">' + resource.title + '</div>' +
          '<div class="modal-links">' + linksHTML + '</div>' +
          '<div class="modal-disclaimer">' +
            '<span>⚠️</span>' +
            '<span>不包含原片，只包含片段素材，仅供免费学习</span>' +
          '</div>' +
        '</div>';

      // 补偿滚动条宽度，防止页面偏移
      var scrollW = window.innerWidth - document.documentElement.clientWidth;
      document.body.style.overflow = 'hidden';
      document.body.style.paddingRight = scrollW + 'px';
      var navbar = document.querySelector('.navbar');
      if (navbar) navbar.style.paddingRight = scrollW + 'px';

      modal.classList.add('show');
    }

    function closeDownloadModal() {
      document.getElementById('downloadModal').classList.remove('show');
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
      var navbar = document.querySelector('.navbar');
      if (navbar) navbar.style.paddingRight = '';
    }

    function modalCopy(text, btn) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { showModalCopied(btn); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showModalCopied(btn); } catch(e) {}
        document.body.removeChild(ta);
      }
    }

    function showModalCopied(btn) {
      var orig = btn.innerHTML;
      btn.classList.add('copied');
      btn.innerHTML = '✅ 已复制';
      setTimeout(function() {
        btn.classList.remove('copied');
        btn.innerHTML = orig;
      }, 2000);
    }

    /* ESC 关闭弹窗 */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeDownloadModal();
    });
  </script>
