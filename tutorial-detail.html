<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="超级站 — 教程详情">
  <title>教程详情 — 超级站</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ========== 教程详情页样式 ========== */

    .detail-page {
      padding-top: 90px;
      padding-bottom: 120px;
      background: var(--color-bg);
      min-height: 100vh;
    }

    .detail-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 var(--space-md);
    }

    /* 返回按钮 */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-secondary);
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition-fast);
      margin-bottom: var(--space-lg);
      font-family: var(--font-family);
    }

    .back-link:hover {
      color: var(--color-primary);
      border-color: var(--color-primary);
      background: var(--color-primary-light);
    }

    /* 标题区 */
    .detail-header {
      text-align: center;
      margin-bottom: var(--space-lg);
    }

    .detail-icon {
      font-size: 72px;
      margin-bottom: var(--space-sm);
    }

    .detail-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.3;
      margin-bottom: var(--space-sm);
    }

    .detail-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    /* 大纲卡片 */
    .outline-card {
      padding: var(--space-md) var(--space-lg);
      background: var(--color-primary-light);
      border-left: 4px solid var(--color-primary);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-xl);
    }

    .outline-card h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .outline-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .outline-list li {
      font-size: 15px;
      color: var(--color-text);
      line-height: 1.6;
      padding-left: 20px;
      position: relative;
    }

    .outline-list li::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 10px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    /* 正文 */
    .detail-content {
      font-size: 16px;
      line-height: 1.9;
      color: var(--color-text);
      margin-bottom: var(--space-xl);
    }

    .detail-content h2 {
      font-size: 20px;
      font-weight: 600;
      margin-top: var(--space-lg);
      margin-bottom: var(--space-sm);
      color: var(--color-text);
      padding-bottom: var(--space-xs);
      border-bottom: 2px solid var(--color-border);
    }

    .detail-content p {
      margin-bottom: var(--space-sm);
    }

    /* 底部导航 */
    .detail-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      padding-top: var(--space-lg);
      border-top: 2px solid var(--color-border);
      flex-wrap: wrap;
    }

    .detail-nav a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-family);
      text-decoration: none;
      color: var(--color-primary);
      background: var(--color-primary-light);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }

    .detail-nav a:hover {
      background: var(--color-primary);
      color: var(--color-white);
    }

    .detail-nav .nav-center {
      display: flex;
      gap: var(--space-sm);
    }

    .detail-nav .nav-disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    /* 未找到 */
    .not-found {
      text-align: center;
      padding: var(--space-2xl) var(--space-md);
    }

    .not-found-icon {
      font-size: 64px;
      margin-bottom: var(--space-md);
    }

    .not-found h2 {
      font-size: 24px;
      margin-bottom: var(--space-sm);
    }

    .not-found p {
      color: var(--color-text-secondary);
      margin-bottom: var(--space-lg);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .detail-header h1 {
        font-size: 24px;
      }

      .detail-nav {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }

      .detail-nav .nav-center {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- ==================== 导航栏 ==================== -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <span class="brand-icon">🎬</span>
      <span>超级站</span>
    </a>
    <ul class="navbar-links">
      <li><a href="index.html">主页</a></li>
      <li><a href="resources.html">资源</a></li>
      <li><a href="tutorials.html">教程</a></li>
      <li><a href="support.html">为爱发电</a></li>
        <li><a href="feedback.html">反馈问题</a></li>
    </ul>
  </nav>

  <!-- ==================== 详情内容 ==================== -->
  <div class="detail-page">
    <div class="detail-container">
      <a href="tutorials.html" class="back-link">← 返回教程列表</a>
      <div id="detailContent">
        <!-- 由 JS 动态渲染 -->
      </div>
    </div>
  </div>

  <!-- ==================== Footer ==================== -->
  <footer class="footer">
    <div class="container footer-content">
      <ul class="footer-links">
        <li><a href="index.html">主页</a></li>
        <li><a href="resources.html">资源</a></li>
        <li><a href="tutorials.html">教程</a></li>
        <li><a href="support.html">为爱发电</a></li>
        <li><a href="feedback.html">反馈问题</a></li>
      </ul>
      <p class="footer-copyright">
        © 2026 超级站 — 本站资源仅供学习交流，请于下载后 24 小时内删除
      </p>
    </div>
  </footer>

  <!-- 回到顶部 -->
  <button class="back-to-top" id="backToTop" title="回到顶部">↑</button>

  <!-- 脚本 -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {

      /* ===== 获取教程 ===== */
      var params = new URLSearchParams(window.location.search);
      var tutorialId = params.get('id');
      var container = document.getElementById('detailContent');
      var tutorial = null;

      if (typeof tutorials !== 'undefined' && tutorialId) {
        for (var i = 0; i < tutorials.length; i++) {
          if (tutorials[i].id === tutorialId) {
            tutorial = tutorials[i];
            break;
          }
        }
      }

      /* ===== 未找到 ===== */
      if (!tutorial) {
        container.innerHTML =
          '<div class="not-found">' +
            '<div class="not-found-icon">😕</div>' +
            '<h2>教程未找到</h2>' +
            '<p>你查找的教程不存在或已被移除</p>' +
            '<a href="tutorials.html" class="btn btn-primary">← 返回教程列表</a>' +
          '</div>';
        document.title = '教程未找到 — 超级站';
        return;
      }

      /* ===== 渲染页面 ===== */
      function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
      var t = tutorial;
      document.title = esc(t.title) + ' — 超级站';
      var html = '';

      // ——— 标题区 ———
      html += '<div class="detail-header fade-in-up">';
      html += '  <div class="detail-icon">' + esc(t.icon) + '</div>';
      html += '  <h1>' + esc(t.title) + '</h1>';
      html += '  <div class="detail-meta">';
      html += '    <span class="tag">' + esc(t.difficulty) + '</span>';
      html += '    <span class="tag tag-outline">' + esc(t.category) + '</span>';
      html += '    <span>📅 ' + esc(t.date) + '</span>';
      html += '  </div>';
      html += '</div>';

      // ——— 大纲卡片 ———
      if (t.outline && t.outline.length > 0) {
        html += '<div class="outline-card fade-in-up delay-2">';
        html += '  <h2>📋 本教程你将学到</h2>';
        html += '  <ul class="outline-list">';
        t.outline.forEach(function(o) {
          html += '    <li>' + esc(o) + '</li>';
        });
        html += '  </ul>';
        html += '</div>';
      }

      // ——— 正文 ———
      if (t.content) {
        html += '<div class="detail-content fade-in-up delay-3">';
        // 简单 Markdown 渲染：## → h2, \n\n → </p><p>
        var contentHtml = t.content
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/^## (.+)$/gm, '</p><h2>$1</h2><p>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        html += '<p>' + contentHtml + '</p>';
        html += '</div>';
      }

      // ——— 底部导航（上一篇 / 下一篇）———
      var index = tutorials.indexOf(tutorial);
      var prev = index > 0 ? tutorials[index - 1] : null;
      var next = index < tutorials.length - 1 ? tutorials[index + 1] : null;

      html += '<div class="detail-nav fade-in-up delay-4">';
      if (prev) {
        html += '<a href="tutorial-detail.html?id=' + prev.id + '">← ' + prev.title + '</a>';
      } else {
        html += '<span></span>';
      }
      html += '<div class="nav-center"><a href="tutorials.html">📖 返回列表</a></div>';
      if (next) {
        html += '<a href="tutorial-detail.html?id=' + next.id + '">' + next.title + ' →</a>';
      } else {
        html += '<span></span>';
      }
      html += '</div>';

      container.innerHTML = html;
      if (typeof refreshFadeIn === 'function') refreshFadeIn();
    });
  </script>
